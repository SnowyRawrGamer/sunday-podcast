name: Sunday Podcast
on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Generate a short test episode'
        type: boolean
        default: true
        required: true
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: podcast-publish
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Generate episode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PODCAST_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          if [ "${{ inputs.test_mode }}" = "true" ]; then python scripts/generate.py --test; else python scripts/generate.py; fi
      - name: Commit show bible
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add show_bible.json
          git commit -m "Record generated podcast episode" || echo "No bible changes"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
