name: Sunday Podcast
on:
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Generate a short test episode'
        type: boolean
        default: false
        required: true
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: podcast-publish
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: kokoro-models-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng libsndfile1
      - run: pip install -r requirements.txt
      - name: Generate CC0 lofi tracks
        run: python scripts/generate_music.py
      - name: Generate episode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PODCAST_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python scripts/generate.py
          elif [ "${{ inputs.test_mode }}" = "true" ]; then
            python scripts/generate.py --test
          else
            python scripts/generate.py
          fi
      - name: Generate artwork and iTunes RSS image tags
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PODCAST_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python scripts/podcast_artwork.py
      - name: Commit show bible, artwork, and generated music
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add show_bible.json music/lofi_1.mp3 music/lofi_2.mp3 assets/
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Record generated podcast episode, artwork, and CC0 music"
          for attempt in 1 2 3 4 5; do
            echo "Syncing with origin/main (attempt ${attempt}/5)"
            if ! git pull --rebase origin main; then
              echo "Rebase conflict detected; retrying with generated output favored for conflicts."
              git rebase --abort || true
              if ! git pull --rebase --strategy-option=theirs origin main; then
                echo "Unable to rebase onto origin/main after conflict fallback."
                git rebase --abort || true
                exit 1
              fi
            fi
            if git push origin HEAD:main; then
              echo "Generated podcast changes pushed successfully."
              exit 0
            fi
            echo "Push raced with another main update; retrying after fetching and rebasing."
            sleep 2
          done
          echo "Push failed after 5 sync attempts."
          exit 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
